buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {

    ext {
        appName = 'One Piece Pixel Dungeon'
        //app/bundle identifier, distinct from the original so both can be installed side by side
        appPackageName = 'com.jack1.onepiecepixeldungeon'
        //java package of the source code (kept from Shattered Pixel Dungeon)
        appJavaPackageName = 'com.shatteredpixel.shatteredpixeldungeon'

        //versionName starts at 0.1.0 (test builds). versionCode must stay above the original
        // game's last code (922) because save compatibility checks compare against it.
        // Bump it by 1 for every release: 0.1.0 = 1000, 0.1.1 = 1001, ...
        appVersionCode = 1000
        appVersionName = '0.1.0'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}