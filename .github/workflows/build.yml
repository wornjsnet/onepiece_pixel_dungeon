name: Test Build

# Builds a desktop JAR and an Android debug APK on every push,
# so each commit can be downloaded and tested from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build desktop JAR
        run: ./gradlew desktop:release --no-daemon

      - name: Build Android debug APK
        run: ./gradlew android:assembleDebug --no-daemon

      - name: Upload desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: OnePiecePD-desktop-${{ github.sha }}
          path: desktop/build/libs/*.jar
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OnePiecePD-android-${{ github.sha }}
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 14
